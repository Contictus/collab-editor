# Go CI (F0) — Node pipeline'ına dokunmaz, sadece services/api-go.
name: go

on:
  push:
    paths:
      - "services/api-go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "services/api-go/**"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U collab -d collab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: services/api-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go build ./...
      # DB integration tests skip without DATABASE_URL; with the postgres
      # service above they run for real (F1: store round-trip + compact).
      - run: go test ./... -count=1
        env:
          DATABASE_URL: postgresql://collab:collab@localhost:5432/collab
