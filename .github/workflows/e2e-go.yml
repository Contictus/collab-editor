# E2E against the Go sync server (default since F8; WS_NODE=1 selects legacy
# Node). Boots Postgres, migrates, then runs the full Playwright suite with
# Go :8080 serving sync (Node :1234 never boots).
name: e2e-go

on:
  push:
    paths:
      - "services/api-go/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/e2e-go.yml"
  pull_request:
    paths:
      - "services/api-go/**"
      - "apps/web/**"
      - "packages/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U collab -d collab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://collab:collab@localhost:5432/collab?schema=public
      JWT_SECRET: ci-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install
      - run: go -C services/api-go build ./...
      - run: pnpm db:migrate
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
