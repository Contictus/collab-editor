services:
  postgres:
    image: postgres:16
    container_name: collab-editor-pg
    restart: unless-stopped
    # Single service: ws-server and web both use packages/db (one DATABASE_URL). No app container — pnpm dev runs on host.
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
