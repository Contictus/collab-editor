services:
  postgres:
    image: postgres:16
    container_name: collab-editor-pg
    restart: unless-stopped
    # Single service: ws-server and web both use packages/db (one DATABASE_URL). No app container — pnpm dev runs on host.
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      # Host 5433: native Postgres (postgresql-x64-18) squats host 5432 on dev
      # machines. Container port stays 5432 (in-network DATABASE_URL unchanged).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go backend (F0 skeleton, opt-in). Default `docker compose up` değişmez:
  # sadece `--profile go` ile ayağa kalkar. Node servislerine dokunmaz.
  api-go:
    build: ./services/api-go
    container_name: collab-editor-api-go
    restart: unless-stopped
    profiles: ["go"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      DATABASE_URL: "postgresql://collab:collab@postgres:5432/collab?schema=public"
    ports:
      - "8080:8080"

volumes:
  pgdata:
